<script>
(function () {
  const data = JSON.parse(document.getElementById('shapes').textContent);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  camera.position.set(0, 0, 12.5);
  camera.lookAt(0, 0, 0);

  // Lighting — key from upper left, cool fill from below-right, rim from behind
  scene.add(new THREE.AmbientLight(0xbfdcf5, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 0.95);
  key.position.set(-4, 6, 8);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x9ec9ee, 0.35);
  fill.position.set(5, -3, 4);
  scene.add(fill);
  const rim = new THREE.DirectionalLight(0xffffff, 0.5);
  rim.position.set(0, 3, -8);
  scene.add(rim);

  // Build THREE.Shapes from traced polygons (first ring = outline, rest = holes)
  function toShapes(polys) {
    const shapes = [];
    for (const poly of polys) {
      const outer = poly[0];
      const shape = new THREE.Shape();
      outer.forEach(function (p, i) {
        if (i === 0) shape.moveTo(p[0], p[1]); else shape.lineTo(p[0], p[1]);
      });
      for (let r = 1; r < poly.length; r++) {
        const hole = new THREE.Path();
        poly[r].forEach(function (p, i) {
          if (i === 0) hole.moveTo(p[0], p[1]); else hole.lineTo(p[0], p[1]);
        });
        shape.holes.push(hole);
      }
      shapes.push(shape);
    }
    return shapes;
  }

  const extrudeOpts = {
    depth: 0.34,
    bevelEnabled: true,
    bevelThickness: 0.02,
    bevelSize: 0.018,
    bevelSegments: 2
  };

  const group = new THREE.Group();

  const whiteMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.38, metalness: 0.08
  });
  const whiteSideMat = new THREE.MeshStandardMaterial({
    color: 0xd6e8f8, roughness: 0.5, metalness: 0.1
  });
  const blueMat = new THREE.MeshStandardMaterial({
    color: 0x0875d4, roughness: 0.35, metalness: 0.15
  });
  const blueSideMat = new THREE.MeshStandardMaterial({
    color: 0x0558a0, roughness: 0.5, metalness: 0.15
  });

  const whiteGeo = new THREE.ExtrudeGeometry(toShapes(data.white), extrudeOpts);
  whiteGeo.translate(0, 0, -extrudeOpts.depth / 2);
  group.add(new THREE.Mesh(whiteGeo, [whiteMat, whiteSideMat]));

  // Blue figure sits proud of the letters — slightly thicker, pushed forward
  const blueOpts = Object.assign({}, extrudeOpts, { depth: 0.46 });
  const blueGeo = new THREE.ExtrudeGeometry(toShapes(data.blue), blueOpts);
  blueGeo.translate(0, 0, -blueOpts.depth / 2);
  group.add(new THREE.Mesh(blueGeo, [blueMat, blueSideMat]));

  group.rotation.x = -0.06;
  scene.add(group);

  // Fit-to-viewport: keep fov fixed and dolly the camera so the logo
  // always occupies ~84% of the width, on any screen or orientation.
  const LOGO_WIDTH = 10;          // geometry units (bbox is -5..5)
  const MARGIN = 1.19;            // breathing room around it
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const halfFov = THREE.MathUtils.degToRad(camera.fov / 2);
    let dist = (LOGO_WIDTH * MARGIN) / (2 * Math.tan(halfFov) * camera.aspect);
    dist = THREE.MathUtils.clamp(dist, 12.5, 60);
    camera.position.set(0, 0, dist);
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();

    // Shadow tracks the logo's projected footprint
    const halfH = dist * Math.tan(halfFov);       // visible half-height in units
    const shadow = document.querySelector('.shadow');
    const logoPxW = (LOGO_WIDTH / (2 * halfH * camera.aspect)) * w;
    shadow.style.width = (logoPxW * 0.62) + 'px';
    shadow.style.height = Math.max(logoPxW * 0.045, 18) + 'px';
    shadow.style.top = (50 + (1.55 / halfH) * 50) + '%';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const SPEED = (Math.PI * 2) / 9; // one revolution every 9s
  let last = performance.now();

  if (reduced) {
    group.rotation.y = -0.32;
    renderer.render(scene, camera);
  } else {
    (function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      group.rotation.y += SPEED * dt;
      renderer.render(scene, camera);
    })(last);
  }
})();
</script>
